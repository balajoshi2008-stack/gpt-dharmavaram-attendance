<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Upload Results to Firestore</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:20px;background:#f5f5f5}
h1{color:#2a5298;margin-bottom:10px}
.info{background:#e3f2fd;border-left:4px solid #2196f3;padding:12px;margin:15px 0;border-radius:4px;font-size:14px}
.auth-box{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin:15px 0}
input{padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;width:200px;margin:5px}
textarea{width:100%;height:250px;font-family:monospace;font-size:11px;border:2px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;margin:5px}
.btn-login{background:#ff9800;color:#fff}.btn-login:hover{background:#f57c00}
.btn-upload{background:#4CAF50;color:#fff;font-size:16px;padding:14px 28px}.btn-upload:hover{background:#388E3C}
#status{margin:10px 0;font-weight:600;font-size:14px}
#progress{margin-top:15px;padding:15px;border-radius:8px;display:none}
.success{background:#e8f5e9;border:1px solid #4CAF50;color:#2e7d32}
.error{background:#ffebee;border:1px solid #f44336;color:#c62828}
.running{background:#fff3e0;border:1px solid #ff9800;color:#e65100}
#log{margin-top:10px;max-height:200px;overflow-y:auto;font-family:monospace;font-size:12px;background:#263238;color:#aed581;padding:12px;border-radius:6px;display:none}
</style>
</head><body>
<h1>📋 Upload Student Results to Firestore</h1>

<div class="auth-box">
    <strong>Step 1: Login as Admin/Faculty</strong><br><br>
    <input type="email" id="email" placeholder="Email" value="admin@dharmavaram.com">
    <input type="password" id="password" placeholder="Password">
    <button class="btn-login" onclick="loginUser()">🔑 Login</button>
    <div id="status" style="color:#999;">Not logged in</div>
</div>

<div class="info">
    <strong>Step 2:</strong> Paste JSON data below (array of student objects with <code>pin</code>, <code>name</code>, <code>branch</code>, <code>semesters</code>).<br>
    Uses <code>merge: true</code> — uploading new semesters won't overwrite existing ones.
</div>

<textarea id="jsonInput" placeholder="Paste JSON array here..."></textarea>
<br>
<button class="btn-upload" onclick="uploadToFirestore()">🚀 Upload to Firestore</button>

<div id="progress"></div>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
    apiKey: "AIzaSyC9nMFnZGdnOm5zXgpSMKiTFpzEBTuPfRM",
    authDomain: "gpt-dharmavaram-attendance.firebaseapp.com",
    projectId: "gpt-dharmavaram-attendance",
    storageBucket: "gpt-dharmavaram-attendance.firebasestorage.app",
    messagingSenderId: "471911252737",
    appId: "1:471911252737:web:a88dcdfafbe0307e7a1100"
});
const db = firebase.firestore();
const auth = firebase.auth();

async function loginUser() {
    const email = document.getElementById('email').value;
    const pw = document.getElementById('password').value;
    const statusEl = document.getElementById('status');
    try {
        statusEl.textContent = '⏳ Logging in...';
        statusEl.style.color = '#e65100';
        await auth.signInWithEmailAndPassword(email, pw);
        statusEl.textContent = '✅ Logged in as ' + email;
        statusEl.style.color = '#2e7d32';
    } catch(e) {
        statusEl.textContent = '❌ Login failed: ' + e.message;
        statusEl.style.color = '#c62828';
    }
}

function log(msg) {
    const logEl = document.getElementById('log');
    logEl.style.display = 'block';
    logEl.innerHTML += new Date().toLocaleTimeString() + ' | ' + msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
}

async function uploadToFirestore() {
    if (!auth.currentUser) {
        alert('Please login first!');
        return;
    }
    const prog = document.getElementById('progress');
    let data;
    try {
        data = JSON.parse(document.getElementById('jsonInput').value);
    } catch(e) {
        prog.className = 'error'; prog.style.display = 'block';
        prog.textContent = '❌ Invalid JSON: ' + e.message;
        return;
    }
    if (!Array.isArray(data) || data.length === 0) {
        prog.className = 'error'; prog.style.display = 'block';
        prog.textContent = '❌ JSON must be a non-empty array';
        return;
    }

    prog.className = 'running'; prog.style.display = 'block';
    prog.textContent = '⏳ Uploading 0 / ' + data.length + '...';
    log('Starting upload of ' + data.length + ' students...');

    let done = 0, errors = 0;
    for (let i = 0; i < data.length; i += 400) {
        const batch = db.batch();
        const chunk = data.slice(i, i + 400);
        chunk.forEach(student => {
            if (!student.pin) { errors++; return; }
            const ref = db.collection('results').doc(student.pin);
            batch.set(ref, student, { merge: true });
        });
        try {
            await batch.commit();
            done += chunk.length;
            prog.textContent = '⏳ Uploaded ' + done + ' / ' + data.length + '...';
            log('Batch committed: ' + done + ' / ' + data.length);
        } catch(e) {
            errors += chunk.length;
            log('❌ Batch error: ' + e.message);
        }
    }

    if (errors === 0) {
        prog.className = 'success';
        prog.textContent = '✅ Successfully uploaded all ' + done + ' students!';
    } else {
        prog.className = 'error';
        prog.textContent = '⚠️ Done with ' + errors + ' errors. ' + done + ' succeeded.';
    }
    log('Upload complete. Success: ' + done + ', Errors: ' + errors);
}
</script>
</body></html>
